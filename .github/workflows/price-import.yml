# Daily store price import for live cities (see docs/data-sources.md).
#
# Reads each online store's public product listings politely (robots.txt obeyed,
# one request a second, stops for the day if a store refuses us) and writes them
# as system `import` price reports through scripts/import/write.sql — one
# transaction per store. Run it by hand with "dry run" ticked to fetch and parse
# without touching the database.
#
# Then the safe duplicate merges (scripts/seed/merge-products.ts --auto): public
# products with the exact same name and size and prices within 25% become one, and
# junk names ("#N/A") are retired. Skipped on dry runs. Repository variable
# PRODUCT_MERGES_PAUSED = "true" makes that step a dry run (it reports, writes nothing).
#
# GitHub turns scheduled workflows off after 60 days without repository activity;
# re-enable it from the Actions tab (docs/deployment.md).

name: Price import

on:
  schedule:
    # 03:17 Karachi time (22:17 UTC); an odd minute avoids the top-of-hour rush.
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Store to import (all, diamond, hydri, imtiaz, chase-up, spar, bin-hashim)
        required: true
        default: all
        type: string
      dry_run:
        description: Fetch and parse only — write nothing
        required: true
        default: true
        type: boolean
      max_pages:
        description: Most requests per store (empty = each store's own cap)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: price-import
  cancel-in-progress: false

jobs:
  import:
    name: Import store prices
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Ensure psql is available
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      # Inputs reach the script through env vars (never inlined into the shell),
      # and the script validates them again. The log is public: it prints counts
      # and a short sample of store listings, never the database URL.
      - name: Import
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SOURCE: ${{ inputs.source || 'all' }}
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_PAGES: ${{ inputs.max_pages }}
        run: |
          args=(--source "$SOURCE")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$MAX_PAGES" ]; then args+=(--max-pages "$MAX_PAGES"); fi
          node --experimental-strip-types --no-warnings scripts/import/run.ts "${args[@]}"

      # After every store is written, so the merges see today's prices.
      - name: Merge duplicate products
        if: ${{ inputs.dry_run != true }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PAUSED: ${{ vars.PRODUCT_MERGES_PAUSED }}
        run: |
          args=(--auto)
          if [ "$PAUSED" = "true" ]; then echo "Paused (PRODUCT_MERGES_PAUSED) — dry run only."; else args+=(--apply); fi
          node --experimental-strip-types --no-warnings scripts/seed/merge-products.ts "${args[@]}"
