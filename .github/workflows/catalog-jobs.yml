# Manual jobs on the shared Compare catalogue (see docs/compare-data.md).
# Every job is a dry run by default: it reads and reports; tick "apply" to write.
# Run them only after the catalogue migrations are deployed.
#
# promote-store: make one private store — and its owner's products priced there —
# public in a city, with the owner's consent (used to seed Karachi with the
# existing Panda Mart import). Needs store_id, region and chain.
#
# add-branches: add or update a city's public in-store branches from a reviewed
# list in scripts/seed/branches/ (taken from each chain's own website). Needs
# branches_file. Never deletes; never touches private or online stores.
#
# close-branch: undo a shared in-store shop (e.g. one made from suggestions by the
# Shared shops workflow): close it and give everyone who moved into it their own shop
# back. Needs store_id. The nightly job never makes that shop again.
#
# merge-products: without "merges", lists likely duplicate products the nightly merge
# leaves alone (in the run's summary; read only). With "merges" (from>into id pairs
# from that list), merges them. Lists, usuals and prices follow.
#
# unmerge-product: undo one merge (product_id = the merged product). The two are kept
# apart from then on.

name: Catalog jobs

on:
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        required: true
        default: add-branches
        type: choice
        options:
          - add-branches
          - promote-store
          - close-branch
          - merge-products
          - unmerge-product
      branches_file:
        description: "add-branches: the list file"
        required: false
        default: scripts/seed/branches/karachi.json
        type: string
      store_id:
        description: "promote-store / close-branch: store id (catalog_stores.id)"
        required: false
        type: string
      region:
        description: "promote-store: city id (regions.id)"
        required: false
        default: karachi
        type: string
      chain:
        description: "promote-store: chain name shown on the store (e.g. Panda Mart)"
        required: false
        type: string
      merges:
        description: "merge-products: from>into product id pairs from the list, separated by spaces (empty = show the list)"
        required: false
        type: string
      product_id:
        description: "unmerge-product: the merged product's id"
        required: false
        type: string
      apply:
        description: Write the changes (unticked = dry run)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: catalog-jobs
  cancel-in-progress: false

jobs:
  promote-store:
    name: Promote a store to public
    if: inputs.job == 'promote-store'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Ensure psql is available
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      # Inputs reach the script through env vars (never inlined into the shell),
      # and the script validates them again.
      - name: Promote store
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STORE_ID: ${{ inputs.store_id }}
          REGION: ${{ inputs.region }}
          CHAIN: ${{ inputs.chain }}
          APPLY: ${{ inputs.apply }}
        run: |
          args=(--store-id "$STORE_ID" --region "$REGION" --chain "$CHAIN")
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          node --experimental-strip-types --no-warnings scripts/seed/promote-store.ts "${args[@]}"

  add-branches:
    name: Add in-store branches
    if: inputs.job == 'add-branches'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Ensure psql is available
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      # The script only reads list files inside scripts/seed/branches/.
      - name: Add branches
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BRANCHES_FILE: ${{ inputs.branches_file }}
          APPLY: ${{ inputs.apply }}
        run: |
          args=(--file "$BRANCHES_FILE")
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          node --experimental-strip-types --no-warnings scripts/seed/add-branches.ts "${args[@]}"

  close-branch:
    name: Close a shared in-store shop
    if: inputs.job == 'close-branch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Ensure psql is available
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Close shop
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STORE_ID: ${{ inputs.store_id }}
          APPLY: ${{ inputs.apply }}
        run: |
          args=(--store-id "$STORE_ID")
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          node --experimental-strip-types --no-warnings scripts/seed/close-branch.ts "${args[@]}"

  merge-products:
    name: Merge duplicate products
    if: inputs.job == 'merge-products'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Ensure psql is available
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Merge products
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MERGES: ${{ inputs.merges }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ -z "${MERGES// /}" ]; then
            node --experimental-strip-types --no-warnings scripts/seed/merge-products.ts --list
          else
            args=(--pairs "$MERGES")
            if [ "$APPLY" = "true" ]; then args+=(--apply); fi
            node --experimental-strip-types --no-warnings scripts/seed/merge-products.ts "${args[@]}"
          fi

  unmerge-product:
    name: Undo a product merge
    if: inputs.job == 'unmerge-product'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Ensure psql is available
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Undo merge
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PRODUCT_ID: ${{ inputs.product_id }}
          APPLY: ${{ inputs.apply }}
        run: |
          args=(--undo "$PRODUCT_ID")
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          node --experimental-strip-types --no-warnings scripts/seed/merge-products.ts "${args[@]}"
