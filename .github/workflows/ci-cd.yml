# CI/CD for SpendLess. Full runbook: docs/deployment.md
#
# - Every pull request and push: lint, design/migration guardrails, build.
# - Every push to main (or a manual run on main): ship to production —
#   database migrations → expose schema → build → Netlify → smoke test →
#   post-deploy migrations → tag + GitHub Release (CalVer YYYY.M.N).
#
# Adding another service later? Add a step in the `deploy` job at the right point
# (before "Deploy to Netlify" if the app needs it first, after the smoke test if it
# depends on the new app), and its secrets to the `production` environment.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  NETLIFY_CLI_VERSION: '27.10.2'

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Colour contrast (WCAG AA)
        run: node scripts/check-contrast.mjs
      - name: Migrations stay in the spendless schema
        run: node scripts/check-migrations.mjs
      - name: Build
        run: npm run build

  deploy:
    name: Deploy to production
    needs: checks
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://spendless.ibexoft.com' }}
    # One production deploy at a time; never cancel one halfway through.
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: write # create the release tag
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://spendless.ibexoft.com' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Check required configuration
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: |
          missing=0
          for name in NETLIFY_AUTH_TOKEN SUPABASE_ACCESS_TOKEN SUPABASE_DB_URL VITE_SUPABASE_ANON_KEY \
                      NETLIFY_SITE_ID SUPABASE_PROJECT_REF VITE_SUPABASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name — add it to the 'production' environment (see docs/deployment.md)."
              missing=1
            fi
          done
          exit $missing

      - name: Compute version (CalVer YYYY.M.N)
        id: version
        run: |
          prefix="$(date -u +%Y).$((10#$(date -u +%m)))"
          last="$(git tag --list "v${prefix}.*" | sed "s/^v${prefix}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)"
          version="${prefix}.$(( ${last:--1} + 1 ))"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${version}" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: ${version}"

      - name: Ensure psql is available
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      # Additive changes only (new tables/columns); the live app keeps working.
      - name: Database migrations (pre-deploy)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: scripts/db-migrate.sh supabase/migrations

      # After the migrations: exposing a schema that doesn't exist breaks the Data API.
      - name: Expose the spendless schema in the Data API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: scripts/supabase-expose-schema.sh spendless

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}
          VITE_APP_COMMIT: ${{ github.sha }}
        run: npm run build

      - name: Deploy to Netlify
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: |
          # --json prints only the deploy details on stdout.
          npx --yes "netlify-cli@${NETLIFY_CLI_VERSION}" deploy \
            --dir=dist --prod --no-build \
            --site="$NETLIFY_SITE_ID" \
            --message="v${{ steps.version.outputs.version }} (${GITHUB_SHA::7})" \
            --json > netlify-deploy.json
          site_name="$(jq -er '.site_name' netlify-deploy.json)"
          deploy_url="$(jq -er '.deploy_url' netlify-deploy.json)"
          echo "origin_url=https://${site_name}.netlify.app" >> "$GITHUB_OUTPUT"
          echo "Netlify deploy: ${deploy_url}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Smoke test production
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ORIGIN_URL: ${{ steps.netlify.outputs.origin_url }}
        run: |
          fetch() { curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors "$@"; }
          # Checked on Netlify itself: the public domain sits behind Cloudflare, which
          # answers GitHub's runners with 403.
          fetch -o /dev/null "$ORIGIN_URL/"
          fetch -o /dev/null "$ORIGIN_URL/privacy"   # SPA redirect (public/_redirects)
          html="$(fetch "$ORIGIN_URL/")"
          bundle="$(grep -m1 -oE '/assets/index-[A-Za-z0-9_-]+\.js' <<<"$html" || true)"
          if [ -z "$bundle" ]; then echo "::error::Could not find the app bundle in index.html"; exit 1; fi
          fetch -o bundle.js "$ORIGIN_URL$bundle"
          # Vite inlines the version as a quoted string literal; src/main.tsx keeps it
          # in the entry bundle (screens that show it are lazy-loaded chunks).
          if ! grep -qF "\"$VERSION\"" bundle.js; then
            echo "::error::Production is not serving v$VERSION"
            exit 1
          fi
          echo "Production is serving v$VERSION ✔" | tee -a "$GITHUB_STEP_SUMMARY"
          # Receipts: "Share to SpendLess" and the PDF reader (public/_headers, _redirects).
          if ! fetch "$ORIGIN_URL/site.webmanifest" | jq -e '.share_target.action == "/share-receipt"' >/dev/null; then
            echo "::error::site.webmanifest has no share_target"; exit 1
          fi
          if ! fetch "$ORIGIN_URL/sw.js" | grep -qF 'share-target-sw.js'; then
            echo "::error::sw.js doesn't import share-target-sw.js"; exit 1
          fi
          share_headers="$(fetch -I "$ORIGIN_URL/share-target-sw.js")"
          if ! grep -qiE '^content-type: [a-z/]*javascript' <<<"$share_headers" || ! grep -qi '^cache-control: no-cache' <<<"$share_headers"; then
            echo "::error::share-target-sw.js must be served as JavaScript with Cache-Control: no-cache"; exit 1
          fi
          pdf_dir="pdf/$(node -p "require('./package.json').dependencies['pdfjs-dist']")-legacy"
          pdf_headers="$(fetch -I "$ORIGIN_URL/$pdf_dir/pdf.worker.min.js")"
          if ! grep -qiE '^content-type: [a-z/]*javascript' <<<"$pdf_headers"; then
            echo "::error::/$pdf_dir/pdf.worker.min.js isn't served as JavaScript"; exit 1
          fi
          if ! grep -qi "^content-security-policy: default-src 'none'" <<<"$pdf_headers"; then
            echo "::warning::/$pdf_dir/ has no Content-Security-Policy header (public/_headers)"
          fi
          # A share that reaches the network is sent back to the app (no service worker yet).
          share="$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' -X POST -F text=smoke "$ORIGIN_URL/share-receipt" || true)"
          case "$share" in
            30[23]\ *'/?share=failed') echo "Share fallback ✔ ($share)" ;;
            *) echo "::warning::POST /share-receipt answered '$share', not a redirect to /?share=failed (public/_redirects)" ;;
          esac
          # The public domain, best effort only (see above).
          code="$(curl -sS -o /dev/null -w '%{http_code}' "$PRODUCTION_URL/" || true)"
          if [ "$code" != "200" ]; then
            echo "::notice::$PRODUCTION_URL answered HTTP $code to the runner (Cloudflare blocks GitHub's runners). Netlify itself is serving v$VERSION."
          fi

      # Destructive/cleanup changes that the previous app version still needed.
      - name: Database migrations (post-deploy)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: scripts/db-migrate.sh supabase/post-deploy

      - name: Tag and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION}" \
            --generate-notes
